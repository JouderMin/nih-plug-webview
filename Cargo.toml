[package]
name = "nih_plug_webview"
version = "0.0.0"
edition = "2021"
authors = ["Max Huttunen <max.huttunen@gmail.com>"]
license = "ISC"

description = "An adapter to use webview GUIs with NIH-plug"

[workspace]
members = ["example", "xtask"]

[dependencies]
baseview = {
  git = "https://github.com/RustAudio/baseview.git",
  branch = "macos-subclass-refactor"
}
crossbeam = "0.8.2"
keyboard-types = "0.6.2"
libc = "0.2.186"
nih_plug = {
  git = "https://github.com/robbert-vdh/nih-plug.git",
  rev = "28b149e"
}
parking_lot = "0.12.5"
rwh05 = { package = "raw-window-handle", version = "0.5.2" }
rwh06 = { package = "raw-window-handle", version = "0.6.2" }
serde_json = "1.0.149"
wry = { version = "0.55.1" }
